@let blog = model();
<div class="admin-page">
  <!-- Admin panel for creating a new blog post -->
  <section class="admin-panel admin-form-panel">
    <header class="admin-panel-header">
      <h1>Add Blogpost</h1>
    </header>

    <!-- Form for new blog post data -->
    <form #form="ngForm" (ngSubmit)="onFormSubmit()" name="blogEntries">
      <div class="admin-form-body">
        <div class="admin-form-grid">
          <!-- Basic blog post details -->
          <div class="admin-form-field">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              name="title"
              class="form-control"
              [(ngModel)]="blog.title"
            />
          </div>

          <div class="admin-form-field">
            <label for="urlHandle">Url Handle</label>
            <input
              type="text"
              id="urlHandle"
              name="urlHandle"
              class="form-control"
              [(ngModel)]="blog.urlHandle"
            />
            @if (urlHandleWarning(); as warning) {
              <small class="admin-form-warning">{{ warning }}</small>
            }
          </div>

          <div class="admin-form-field is-full">
            <label for="shortDescription">Short Description</label>
            <input
              type="text"
              id="shortDescription"
              name="shortDescription"
              class="form-control"
              [(ngModel)]="blog.shortDescription"
            />
          </div>

          <!-- Featured image URL and preview -->
          <div class="admin-form-field is-full">
            <label for="featuredImageUrl">Featured Image Url</label>
            <div class="admin-input-group">
              <input
                type="text"
                id="featuredImageUrl"
                name="featuredImageUrl"
                class="form-control"
                [(ngModel)]="blog.featuredImageUrl"
              />
              <button
                type="button"
                class="admin-primary-action admin-input-action"
                name="selectImageButton"
                data-bs-toggle="modal"
                data-bs-target="#selectModal"
              >
                <i class="bi bi-image" aria-hidden="true"></i>
                Select Picture
              </button>
            </div>

            @if (blog.featuredImageUrl !== '') {
              <div class="admin-form-media-preview">
                <img
                  [src]="blog.featuredImageUrl"
                  alt="Selected featured image"
                />
              </div>
            }
          </div>

          <!-- Rich content editor for the blog post body -->
          <div class="admin-form-field is-full">
            <section class="admin-editor-card" aria-labelledby="contentLabel">
              <label
                class="admin-editor-card-header"
                for="content"
                id="contentLabel"
              >
                Content
              </label>
              <app-markdown-editor
                editorId="content"
                ariaLabelledBy="contentLabel"
                [(content)]="blog.content"
              />
            </section>
          </div>

          <!-- Publishing metadata and category selection -->
          <div class="admin-form-field">
            <label for="publishedDate">Published Date</label>
            <input
              type="date"
              id="publishedDate"
              name="publishedDate"
              class="form-control"
              [value]="blog.publishedDate | date: 'yyyy-MM-dd'"
              [ngModel]="blog.publishedDate | date: 'yyyy-MM-dd'"
              (ngModelChange)="blog.publishedDate = $event"
            />
          </div>

          <div class="admin-form-field">
            <label for="author">Author</label>
            <input
              type="text"
              id="author"
              name="author"
              class="form-control"
              [(ngModel)]="blog.author"
            />
          </div>

          <div class="admin-form-field">
            <label class="admin-form-section-title">Status</label>
            <div class="form-check admin-form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="isVisible"
                name="isVisible"
                [(ngModel)]="blog.isVisible"
              />
              <label class="form-check-label" for="isVisible">Publish</label>
            </div>
          </div>

          <div class="admin-form-field">
            @if (categories$ | async; as categories) {
              <label for="categories">Categories</label>
              <select
                class="form-select scroll scroll--simple admin-multi-select"
                [(ngModel)]="blog.categories"
                id="categories"
                name="categories"
                multiple
              >
                @for (category of categories; track category) {
                  <option [value]="category.id">{{ category.name }}</option>
                }
              </select>
            }
          </div>
        </div>
      </div>

      <footer class="admin-form-actions">
        <button type="submit" class="admin-primary-action" name="saveButton">
          <i class="bi bi-check2" aria-hidden="true"></i>
          Save
        </button>
      </footer>
    </form>
  </section>
</div>

<!-- Shared image selector modal for choosing the featured image -->
<div
  class="modal fade admin-modal"
  id="selectModal"
  tabindex="-1"
  data-bs-backdrop="true"
  data-bs-keyboard="true"
  aria-labelledby="selectModalLabel"
  aria-hidden="true"
>
  <app-image-selector imageCategory="Blog" />
</div>
