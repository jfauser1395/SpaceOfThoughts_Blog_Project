<div class="admin-page">
  <!-- Admin panel for editing an existing blog post -->
  <section class="admin-panel admin-form-panel">
    <header class="admin-panel-header">
      <h1>Edit Blogpost</h1>
    </header>

    @if (model) {
      <!-- Form for editing blog post data -->
      <form #form="ngForm" (ngSubmit)="onFormSubmit()" name="editBlogEntries">
        <div class="admin-form-body">
          <div class="admin-form-grid">
            <!-- Basic blog post details -->
            <div class="admin-form-field">
              <label for="title">Title</label>
              <input
                type="text"
                id="title"
                name="title"
                class="form-control"
                [(ngModel)]="model.title"
              />
            </div>

            <div class="admin-form-field">
              <label for="urlHandle">Url Handle</label>
              <input
                type="text"
                id="urlHandle"
                name="urlHandle"
                class="form-control"
                [(ngModel)]="model.urlHandle"
              />
              @if (urlHandleWarning) {
                <small class="admin-form-warning">{{ urlHandleWarning }}</small>
              }
            </div>

            <div class="admin-form-field is-full">
              <label for="shortDescription">Short Description</label>
              <input
                type="text"
                id="shortDescription"
                name="shortDescription"
                class="form-control"
                [(ngModel)]="model.shortDescription"
              />
            </div>

            <!-- Featured image URL and preview -->
            <div class="admin-form-field is-full">
              <label for="featuredImageUrl">Featured Image Url</label>
              <div class="admin-input-group">
                <input
                  type="text"
                  id="featuredImageUrl"
                  name="featuredImageUrl"
                  class="form-control"
                  [(ngModel)]="model.featuredImageUrl"
                />
                <button
                  type="button"
                  class="admin-primary-action admin-input-action"
                  name="selectImageButton"
                  data-bs-toggle="modal"
                  data-bs-target="#selectModal"
                >
                  <i class="bi bi-image" aria-hidden="true"></i>
                  Select Picture
                </button>
              </div>

              @if (model.featuredImageUrl != "") {
                <div class="admin-form-media-preview">
                  <img
                    [src]="model.featuredImageUrl"
                    alt="Selected featured image"
                  />
                </div>
              }
            </div>

            <!-- Rich content editor for the blog post body -->
            <div class="admin-form-field is-full">
              <section class="admin-editor-card" aria-labelledby="contentLabel">
                <label
                  class="admin-editor-card-header"
                  for="content"
                  id="contentLabel"
                >
                  Content
                </label>
                <app-markdown-editor
                  editorId="content"
                  ariaLabelledBy="contentLabel"
                  [(content)]="model.content"
                ></app-markdown-editor>
              </section>
            </div>

            <!-- Publishing metadata and category selection -->
            <div class="admin-form-field">
              <label for="publishedDate">Published Date</label>
              <input
                type="date"
                id="publishedDate"
                name="publishedDate"
                class="form-control"
                [value]="model.publishedDate | date: 'yyyy-MM-dd'"
                [ngModel]="model.publishedDate | date: 'yyyy-MM-dd'"
                (ngModelChange)="model.publishedDate = $event"
              />
            </div>

            <div class="admin-form-field">
              <label for="author">Author</label>
              <input
                type="text"
                id="author"
                name="author"
                class="form-control"
                [(ngModel)]="model.author"
              />
            </div>

            <div class="admin-form-field">
              <label class="admin-form-section-title">Status</label>
              <div class="form-check admin-form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="isVisible"
                  [(ngModel)]="model.isVisible"
                  name="isVisible"
                />
                <label class="form-check-label" for="isVisible">Publish</label>
              </div>
            </div>

            <div class="admin-form-field">
              @if (categories$ | async; as categories) {
                <label for="categories">Categories</label>
                <select
                  class="form-select scroll scroll--simple admin-multi-select"
                  [(ngModel)]="selectedCategories"
                  name="categories"
                  id="categories"
                  multiple
                >
                  @for (category of categories; track category) {
                    <option [value]="category.id">{{ category.name }}</option>
                  }
                </select>
              }
            </div>
          </div>
        </div>

        <footer class="admin-form-actions">
          <button type="submit" class="admin-primary-action">
            <i class="bi bi-check2" aria-hidden="true"></i>
            Save
          </button>

          <button
            type="button"
            class="admin-danger-action"
            name="deleteButton"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            <i class="bi bi-trash" aria-hidden="true"></i>
            Delete
          </button>
        </footer>

        <!-- Delete confirmation modal for the blog post -->
        <div
          class="modal fade admin-modal"
          id="staticBackdrop"
          data-bs-backdrop="true"
          data-bs-keyboard="true"
          tabindex="-1"
          aria-labelledby="staticBackdropLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">
                  Delete Blogpost
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  name="closeButton"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                Do you really want to delete this Blogpost?
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="admin-row-action"
                  name="closeButton"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button
                  type="button"
                  class="admin-danger-action"
                  name="deleteButtonModal"
                  data-bs-dismiss="modal"
                  (click)="onDelete()"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    } @else {
      <!-- Loading state while the blog post request is pending -->
      <div class="admin-form-body">
        <div class="admin-empty-state" role="status">Loading blogpost...</div>
      </div>
    }
  </section>
</div>

<!-- Shared image selector modal for choosing the featured image -->
<div
  class="modal fade admin-modal"
  id="selectModal"
  data-bs-backdrop="true"
  data-bs-keyboard="true"
  tabindex="-1"
  aria-labelledby="selectModalLabel"
  aria-hidden="true"
>
  <app-image-selector imageCategory="Blog"></app-image-selector>
</div>
