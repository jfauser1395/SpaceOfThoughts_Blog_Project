<div class="modal-dialog modal-lg modal-dialog-centered">
  <div class="modal-content admin-image-selector">
    <!-- Image selector modal header -->
    <div class="modal-header">
      <h1 class="modal-title fs-5" id="selectModalLabel">Select Picture</h1>
      <button
        #closeModalButton
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
        name="closeModalButton"
      ></button>
    </div>

    <div class="modal-body admin-image-selector-body">
      <!-- Upload form for adding a new image -->
      <section class="admin-image-upload">
        <h2>Upload Image</h2>
        <form
          novalidate
          class="admin-image-upload-form"
          [formGroup]="form"
          (ngSubmit)="uploadImage()"
          name="imageForm"
        >
          @if (uploadError(); as errorMessage) {
            <!-- Keep API validation visible so the administrator can choose another name -->
            <div class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>
          }

          <div class="admin-form-field">
            <label for="fileInput">Image File</label>
            <input
              type="file"
              id="fileInput"
              class="form-control"
              accept=".jpg,.jpeg,.png,.webp,.avif,image/jpeg,image/png,image/webp,image/avif"
              (change)="onFileUploadChange($event)"
              name="file"
              formControlName="file"
              aria-label="File input for uploading image"
            />
          </div>

          <div class="admin-image-upload-grid">
            <div class="admin-form-field">
              <label for="imageFileName">File Name</label>
              <input
                type="text"
                id="imageFileName"
                class="form-control"
                name="fileName"
                formControlName="fileName"
                aria-label="Input for file name"
              />
            </div>

            <div class="admin-form-field">
              <label for="imageTitle">Title</label>
              <input
                type="text"
                id="imageTitle"
                class="form-control"
                name="title"
                formControlName="title"
                aria-label="Input for image title"
              />
            </div>
          </div>

          <div class="admin-image-selector-actions">
            <button
              type="submit"
              class="admin-primary-action"
              aria-label="Upload image"
              name="uploadButton"
              [disabled]="!form.valid || isUploading()"
            >
              <i class="bi bi-upload" aria-hidden="true"></i>
              Upload
            </button>
          </div>
        </form>
      </section>

      @if (!noImages()) {
        <!-- Library of previously uploaded images -->
        <section class="admin-image-library">
          <h2>Uploaded Images</h2>
          <div class="admin-image-window scroll scroll--simple">
            @if (images$ | async; as images) {
              <div class="admin-image-grid">
                @for (image of images; track image) {
                  <article class="admin-image-card">
                    <!-- The image itself is the accessible selection control -->
                    <button
                      type="button"
                      class="admin-image-select"
                      data-bs-dismiss="modal"
                      (click)="selectImage(image)"
                      name="selectImageButton"
                      [attr.aria-label]="'Select image: ' + image.title"
                      [attr.title]="'Select ' + image.title"
                    >
                      <img
                        [src]="image.url"
                        alt=""
                        class="admin-image-preview"
                        loading="lazy"
                        decoding="async"
                      />
                    </button>

                    <h3>{{ image.title }}</h3>

                    <div class="admin-image-actions">
                      <button
                        type="button"
                        class="admin-danger-action"
                        (click)="deleteImage(image)"
                        name="deleteImageButton"
                        aria-label="Delete image button"
                      >
                        <i class="bi bi-trash" aria-hidden="true"></i>
                        Delete
                      </button>
                    </div>
                  </article>
                }
              </div>
            }
          </div>
        </section>
      }
    </div>
  </div>
</div>
