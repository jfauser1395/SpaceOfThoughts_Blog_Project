<main class="cover-page">
  <!-- Public and editor surfaces render this exact same hero component. -->
  <app-cover-hero
    [page]="coverPage()"
    [currentUser]="user()"
    [backgroundImageUrl]="backgroundImageUrl()"
    [backgroundImagePosition]="coverPage()?.backgroundImagePosition"
    [loading]="isPageLoading()"
    [notPublished]="isNotPublished()"
    [blogPreviews]="visibleBlogPreviews()"
    [blogPreviewPosition]="activeBlogPreviewPosition()"
    [blogPreviewTotal]="blogPreviewPosts().length"
  />

  <!-- Use the shared public loader while cover content and the hero image initialize -->
  <app-loading-overlay [loading]="isPageLoading()" [lockPageScroll]="false" />

  <button
    type="button"
    class="cover-theme-toggle"
    (click)="themeService.toggleTheme()"
    [attr.aria-label]="
      themeService.isDarkTheme()
        ? 'Switch to light theme'
        : 'Switch to dark theme'
    "
    [attr.title]="
      themeService.isDarkTheme()
        ? 'Switch to light theme'
        : 'Switch to dark theme'
    "
  >
    @if (themeService.isDarkTheme()) {
      <i class="bi bi-sun-fill" aria-hidden="true"></i>
    } @else {
      <i class="bi bi-moon-stars-fill" aria-hidden="true"></i>
    }
  </button>
</main>
