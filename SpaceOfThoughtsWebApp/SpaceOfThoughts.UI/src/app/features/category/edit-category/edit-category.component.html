<div class="admin-page">
  <!-- Admin panel for editing an existing category -->
  <section class="admin-panel admin-form-panel">
    <header class="admin-panel-header">
      <h1>Edit Category</h1>
    </header>

    @if (category(); as currentCategory) {
      <!-- Form for editing category data -->
      <form #editCategoryForm="ngForm" (ngSubmit)="onFormSubmit()">
        <div class="admin-form-body">
          <!-- Category ID, name, and URL handle fields -->
          <div class="admin-form-grid">
            <div class="admin-form-field is-full">
              <label for="categoryId">Id</label>
              <input
                type="text"
                disabled
                id="categoryId"
                class="form-control"
                name="categoryId"
                value="{{ currentCategory.id }}"
              />
            </div>

            <div class="admin-form-field">
              <label for="categoryName">Name</label>
              <input
                type="text"
                id="categoryName"
                class="form-control"
                name="categoryName"
                [(ngModel)]="currentCategory.name"
                required
              />
            </div>

            <div class="admin-form-field">
              <label for="categoryUrlHandle">Url Handle</label>
              <input
                type="text"
                id="categoryUrlHandle"
                class="form-control"
                name="categoryUrlHandle"
                [(ngModel)]="currentCategory.urlHandle"
                required
              />
            </div>
          </div>
        </div>

        <footer class="admin-form-actions">
          <button
            type="submit"
            class="admin-primary-action"
            name="saveButton"
            [disabled]="!editCategoryForm.valid"
          >
            <i class="bi bi-check2" aria-hidden="true"></i>
            Save
          </button>

          <button
            type="button"
            class="admin-danger-action"
            name="deleteButton"
            data-bs-toggle="modal"
            data-bs-target="#staticBackdrop"
          >
            <i class="bi bi-trash" aria-hidden="true"></i>
            Delete
          </button>
        </footer>

        <!-- Delete confirmation modal for the category -->
        <div
          class="modal fade admin-modal"
          id="staticBackdrop"
          data-bs-backdrop="static"
          data-bs-keyboard="false"
          tabindex="-1"
          aria-labelledby="staticBackdropLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">
                  Delete Category
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  name="closeModalIcon"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                Do you really want to delete the category?
              </div>
              <div class="modal-footer">
                <button
                  type="button"
                  class="admin-row-action"
                  name="closeButton"
                  data-bs-dismiss="modal"
                >
                  Close
                </button>
                <button
                  type="button"
                  class="admin-danger-action"
                  name="deleteButtonModal"
                  data-bs-dismiss="modal"
                  (click)="onDelete()"
                >
                  Delete
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>
    } @else {
      <!-- Empty state when the category cannot be found -->
      <div class="admin-form-body">
        <div class="admin-empty-state" role="alert">Category not found!</div>
      </div>
    }
  </section>
</div>
