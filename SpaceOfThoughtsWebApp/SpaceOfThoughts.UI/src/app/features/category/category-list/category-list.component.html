<div class="admin-page">
  <!-- Admin panel for managing categories -->
  <section class="admin-panel">
    <!-- Category list header and add action -->
    <header class="admin-panel-header">
      <div>
        <h1>Manage categories</h1>
      </div>

      <button
        type="button"
        class="admin-primary-action"
        [routerLink]="['/admin/categories/add']"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
        <span>Add category</span>
      </button>
    </header>

    <!-- Search toolbar for filtering categories -->
    <div class="admin-toolbar">
      <div class="admin-search-field custom-input-group">
        <input
          type="text"
          id="searchField"
          class="form-control"
          (keyup.enter)="onSearch(queryText.value)"
          placeholder="Find category"
          aria-label="Find category"
          aria-describedby="basic-addon1"
          #queryText
        />
        <button
          class="admin-icon-button inside-btn"
          name="searchButton"
          (click)="onSearch(queryText.value)"
          aria-label="Search categories"
        >
          <i class="bi bi-search" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    @if (categories$ | async; as categories) {
      <!-- Category table with sortable columns -->
      <div class="table-responsive admin-table-wrap">
        <table class="table admin-table">
          <thead>
            <tr>
              <th [attr.aria-sort]="getSortAria('name')">
                <button
                  type="button"
                  class="admin-sort-button"
                  [class.is-active]="isSortedBy('name')"
                  name="sortNameButton"
                  (click)="sort('name')"
                  [attr.aria-label]="getSortLabel('category name', 'name')"
                >
                  Name
                </button>
              </th>
              <th [attr.aria-sort]="getSortAria('urlHandle')">
                <button
                  type="button"
                  class="admin-sort-button"
                  [class.is-active]="isSortedBy('urlHandle')"
                  name="sortUrlHandleButton"
                  (click)="sort('urlHandle')"
                  [attr.aria-label]="getSortLabel('url handle', 'urlHandle')"
                >
                  Url handle
                </button>
              </th>
              <th class="admin-tools-column">
                <i class="bi bi-tools" aria-hidden="true"></i>
              </th>
            </tr>
          </thead>

          <tbody>
            @for (category of categories; track category.id) {
              <tr>
                <td class="admin-strong-cell">{{ category.name }}</td>
                <td>
                  {{ category.urlHandle }}
                </td>
                <td>
                  <div class="admin-row-actions">
                    <a
                      class="admin-row-action"
                      name="editButton"
                      [routerLink]="['/admin/categories', category.id]"
                    >
                      <i class="bi bi-pencil-square" aria-hidden="true"></i>
                      <span>Edit</span>
                    </a>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }

    @if (list.length > 1) {
      <!-- Pagination controls for the category table -->
      <footer class="admin-panel-footer">
        <nav aria-label="Page navigation">
          <ul class="pagination admin-pagination">
            <li class="page-item" [class.disabled]="pageNumber === 1">
              <button
                class="page-link"
                (click)="getPrevPage()"
                [disabled]="pageNumber === 1"
                name="previousButton"
                aria-label="Previous page"
              >
                <i class="bi bi-caret-left" aria-hidden="true"></i>
              </button>
            </li>

            @for (item of list; track $index; let idx = $index) {
              <li class="page-item" [class.active]="pageNumber === idx + 1">
                <button
                  class="page-link"
                  (click)="getPage(idx + 1)"
                  [attr.aria-current]="pageNumber === idx + 1 ? 'page' : null"
                  [attr.aria-label]="'Page ' + (idx + 1)"
                  name="pageNumberButtons"
                >
                  {{ idx + 1 }}
                </button>
              </li>
            }

            <li
              class="page-item"
              [class.disabled]="pageNumber === list.length"
            >
              <button
                class="page-link"
                (click)="getNextPage()"
                [disabled]="pageNumber === list.length"
                name="nextButton"
                aria-label="Next page"
              >
                <i class="bi bi-caret-right" aria-hidden="true"></i>
              </button>
            </li>
          </ul>
        </nav>
      </footer>
    }
  </section>
</div>
