<div class="admin-page">
  <!-- Admin panel for creating a new category -->
  <section class="admin-panel admin-form-panel">
    <header class="admin-panel-header">
      <h1>Add Category</h1>
    </header>

    <!-- Form for new category data -->
    <form
      #categoryForm="ngForm"
      (ngSubmit)="onFormSubmit()"
      name="categoryForm"
    >
      <div class="admin-form-body">
        <!-- Category name and URL handle fields -->
        <div class="admin-form-grid">
          <div class="admin-form-field">
            <label for="categoryName">Category Name</label>
            <input
              type="text"
              id="categoryName"
              name="categoryName"
              class="form-control"
              [(ngModel)]="model.name"
              required
            />
          </div>

          <div class="admin-form-field">
            <label for="categoryUrlHandle">Category Url Handle</label>
            <input
              type="text"
              id="categoryUrlHandle"
              name="categoryUrlHandle"
              class="form-control"
              [(ngModel)]="model.urlHandle"
              required
            />
          </div>
        </div>
      </div>

      <!-- Save action for the category form -->
      <footer class="admin-form-actions">
        <button
          type="submit"
          class="admin-primary-action"
          name="submitButton"
          [disabled]="!categoryForm.valid"
        >
          <i class="bi bi-check2" aria-hidden="true"></i>
          Save Category
        </button>
      </footer>
    </form>
  </section>
</div>
