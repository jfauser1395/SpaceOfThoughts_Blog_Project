<!doctype html>
<html
  lang="en"
  data-theme="dark"
  data-bs-theme="dark"
  style="color-scheme: dark"
>
  <head>
    <meta charset="utf-8" />
    <title>SpaceOfThoughts</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A thoughtful independent blog about ideas, experiences, and the things that shape our space."
    />
    <meta name="application-name" content="SpaceOfThoughts" />
    <meta name="color-scheme" content="dark light" />

    <!-- Preload the navigation font because it is used above the fold -->
    <link
      rel="preload"
      href="/assets/fonts/Magiesta.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon-180x180.png"
    />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#17191d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SpaceOfThoughts" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body class="scroll scroll--simple scrollHight">
    <!-- Root Angular component -->
    <app-root></app-root>
  </body>
</html>
