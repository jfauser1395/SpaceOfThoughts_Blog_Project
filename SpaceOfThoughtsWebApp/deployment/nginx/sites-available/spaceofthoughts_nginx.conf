# Deploy this file as /etc/nginx/sites-available/spaceofthoughts_nginx.conf.
# Enable it with a symbolic link at /etc/nginx/sites-enabled/spaceofthoughts_nginx.conf.
# Keep global process, events, TLS, logging, and compression defaults in nginx.conf.
# HTTP/3 requires Nginx built with --with-http_v3_module and inbound UDP port 443.

# Reuse local connections to the ASP.NET Core API.
upstream spaceofthoughts_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

# Accept IPv6 HTTP only for certificate validation and HTTPS redirection.
server {
    # Bind only the IPv6 wildcard address; Nginx enables IPv6-only sockets by default.
    listen [::]:80;
    server_name spaceofthoughts.com www.spaceofthoughts.com;

    # Let Certbot renew certificates through its webroot without an HTTPS redirect.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Use one canonical HTTPS origin for authentication, PWA state, and search engines.
    location / {
        return 301 https://spaceofthoughts.com$request_uri;
    }
}

# Redirect direct HTTPS requests for www to the same canonical origin.
server {
    # Keep TCP 443 for HTTP/1.1 and HTTP/2 clients and as a fallback when QUIC is blocked.
    # Do not add an IPv4 listener; public client traffic is intentionally IPv6-only.
    listen [::]:443 ssl;

    # Accept HTTP/3 over QUIC on UDP 443. Specify reuseport only on the first QUIC
    # listener for this address and port so multiple Nginx workers can share traffic.
    listen [::]:443 quic reuseport;

    # Use the current HTTP/2 syntax available in Nginx 1.25.1 and newer.
    http2 on;

    # Make HTTP/3 support explicit even though the module currently enables it by default.
    http3 on;

    # Validate client addresses before allocating full QUIC connection state.
    quic_retry on;

    server_name www.spaceofthoughts.com;

    # The certificate must contain both spaceofthoughts.com and www.spaceofthoughts.com.
    ssl_certificate /etc/letsencrypt/live/spaceofthoughts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaceofthoughts.com/privkey.pem;

    # Preserve HTTPS-only behavior when the browser reaches the redirecting hostname.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Advertise UDP 443 so supporting clients can upgrade subsequent requests to HTTP/3.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    return 301 https://spaceofthoughts.com$request_uri;
}

# Serve the Angular PWA, public images, and reverse-proxied API over HTTPS.
server {
    # Keep TCP 443 for HTTP/1.1 and HTTP/2 clients and as a fallback when QUIC is blocked.
    # Share the IPv6-only HTTPS listener with the canonical application host.
    listen [::]:443 ssl;

    # Share the UDP 443 QUIC socket declared above. Do not repeat reuseport here;
    # it is a socket-level option and may be specified only once per address and port.
    listen [::]:443 quic;

    # Use the current HTTP/2 syntax available in Nginx 1.25.1 and newer.
    http2 on;

    # Make HTTP/3 support explicit even though the module currently enables it by default.
    http3 on;

    # Validate client addresses before allocating full QUIC connection state.
    quic_retry on;

    server_name spaceofthoughts.com;

    # Serve the deployed Angular browser build from this directory.
    root /opt/spaceofthoughts/current/ui/browser;
    index index.html;

    # Use the Let's Encrypt certificate issued for the configured domain names.
    ssl_certificate /etc/letsencrypt/live/spaceofthoughts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaceofthoughts.com/privkey.pem;

    # Tell browsers to use HTTPS for one year after their first HTTPS response.
    # Add includeSubDomains or preload only after every subdomain permanently uses HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Advertise UDP 443 while retaining TCP 443 as the transparent fallback path.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # Allow framing only by this origin and also enforce it through the CSP below.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent browsers from interpreting a response as a different MIME type.
    add_header X-Content-Type-Options "nosniff" always;

    # Disable the obsolete browser XSS auditor; the Content Security Policy is safer.
    add_header X-XSS-Protection "0" always;

    # Send only the origin when navigating from HTTPS to another origin.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable browser capabilities that this blog does not use.
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    # Allow locally bundled Angular resources, image previews, and the Angular worker.
    # Inline styles remain necessary for Angular component styles and Bootstrap behavior.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://spaceofthoughts.com https://www.spaceofthoughts.com; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;

    # Reject attempts to address the private storage tree as publicly served files.
    # Authorized private-image access remains under /api/Images/private in ASP.NET.
    location = /Images/Private {
        return 404;
    }

    location ^~ /Images/Private/ {
        return 404;
    }

    # Serve only files located under Images/Public directly through Nginx.
    location ^~ /Images/ {
        alias /var/lib/spaceofthoughts/images/Public/;
        autoindex off;

        # Public image names can be replaced, so browsers revalidate after one hour.
        expires 1h;

        # Raster formats are absent from the global compression lists because they
        # are already compressed; text-based SVG files can still use Brotli or gzip.

        access_log off;
        log_not_found off;

        # Public storage is read-only through Nginx; uploads remain API operations.
        limit_except GET {
            deny all;
        }
    }

    # Forward API requests to Kestrel while preserving the original client context.
    location ^~ /api/ {
        proxy_pass http://spaceofthoughts_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No WebSocket forwarding is currently needed; clearing this header also
        # permits persistent connections to the local API upstream.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;

        # Program.cs currently owns API compression for response types that benefit.
        # Disable only Nginx's filters here so a response is compressed at most once.
        gzip off;
        brotli off;

        # Replace duplicate legacy API headers with the consistent headers above.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
    }

    # Keep a bare /api request out of the Angular route fallback.
    location = /api {
        return 308 /api/;
    }

    # Require browser-cache revalidation because this file references versioned bundles.
    # Angular's service worker may still manage its own verified application cache.
    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    # Always revalidate Angular service-worker update files so new PWA versions
    # are discovered promptly instead of being hidden by the browser HTTP cache.
    location ~ ^/(?:ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        try_files $uri =404;
        expires -1;
    }

    # The manifest can be cached briefly because it changes less often than bundles.
    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        expires 1h;
    }

    # Prevent access to hidden files, except the Let's Encrypt namespace.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache compiled frontend bundles and local fonts, but never turn missing files
    # into index.html because that would hide incomplete or inconsistent deployments.
    location ~* \.(?:css|eot|js|mjs|ttf|woff|woff2)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        log_not_found off;
    }

    # Cache frontend-owned image assets briefly; raster formats are already compressed.
    location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
        try_files $uri =404;
        expires 1h;
        access_log off;
        log_not_found off;
    }

    # Serve existing Angular files and fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
