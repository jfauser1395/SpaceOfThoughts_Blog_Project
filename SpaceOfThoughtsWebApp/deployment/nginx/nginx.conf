# Deploy this file as /etc/nginx/nginx.conf.
# It contains process-wide settings and loads each enabled website configuration.

# Run request-processing workers as the unprivileged Debian/Ubuntu web user.
user www-data;

# Select the number of worker processes according to the available CPU cores.
worker_processes auto;

# Store the Nginx master process ID so management tools can reload or stop Nginx.
pid /run/nginx.pid;

# Record operational warnings and errors without mixing them into the access log.
error_log /var/log/nginx/error.log warn;

# Load optional dynamic modules, including Brotli when installed as a module.
include /etc/nginx/modules-enabled/*.conf;

events {
    # Set the maximum number of simultaneous connections handled by each worker.
    # Reverse-proxied requests can use one client and one upstream connection.
    worker_connections 768;

    # Keep the default gradual accept behavior so workers share new connections.
    # multi_accept on;
}

http {
    # Use efficient kernel file transfers for frontend files and public images.
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keep reusable client connections open for a reasonable amount of time.
    keepalive_timeout 65;

    # Reserve enough space for MIME type and server-name lookup tables.
    types_hash_max_size 2048;

    # Do not disclose the installed Nginx version in generated responses.
    server_tokens off;

    # Accept the image uploads supported by the API while rejecting larger bodies.
    client_max_body_size 20M;

    # Load standard file-extension mappings and use binary data as the safe fallback.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Record requests and include timing information useful for API diagnostics.
    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" request_time=$request_time '
        'upstream_time=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Permit only modern TLS protocol versions for every HTTPS website.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Share TLS sessions between workers and avoid independently encrypted tickets.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Let modern clients select their strongest mutually supported TLS cipher.
    ssl_prefer_server_ciphers off;

    # Use gzip when a client does not support Brotli.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Prefer Brotli for compressible frontend resources when the client supports it.
    # The installed Brotli module must be loaded through modules-enabled above.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Load optional HTTP-level snippets whose filenames end in ".conf".
    include /etc/nginx/conf.d/*.conf;

    # Load enabled websites, including the Space of Thoughts site configuration.
    include /etc/nginx/sites-enabled/*;
}
